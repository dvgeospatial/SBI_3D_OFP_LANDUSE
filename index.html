<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Norwich SBI: 3D Terrain & Data Layers</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  
  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  
  <!-- Proj4 & Turf.js for Coordinate Conversion & Analysis -->
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.9.0/dist/proj4.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    /* UI Controls Panel */
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2); width: 240px;
    }
    .section-title { font-size:12px; font-weight:bold; color:#333; margin-top: 10px; display:block; border-top: 1px solid #ddd; padding-top: 8px; }
    
    input[type="text"] { padding: 5px; width: 100%; box-sizing: border-box; margin-bottom: 8px; border: 1px solid #ccc; }
    button {
      padding: 8px; background-color: #333; color: white; border: none; 
      border-radius: 3px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px;
    }
    button:hover { background-color: #555; }

    .layer-row { display: flex; align-items: center; font-size: 13px; cursor: pointer; margin-bottom: 5px; color: #333; }
    .layer-row input { margin-right: 8px; cursor: pointer; }

    #loadingIndicator { 
        font-size: 11px; color: #666; margin-top: 5px; display: none; font-style: italic; 
    }

    /* Terrain Slider */
    .slider-container { margin-top: 10px; border-top: 1px solid #ddd; padding-top:10px; }
    .slider-container label { display: block; font-size: 12px; margin-bottom: 4px; }
    input[type=range] { width: 100%; }

    /* Legend */
    #legendPanel {
      position: absolute; bottom: 30px; right: 10px;
      background: rgba(255, 255, 255, 0.95); padding: 10px;
      border-radius: 5px; z-index: 100; max-height: 400px;
      overflow-y: auto; width: 200px; display: none;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2); font-size: 12px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
    .legend-color { width: 16px; height: 16px; margin-right: 8px; border: 1px solid #ccc; opacity: 0.8; }
  </style>
</head>

<body>

<div id="map"></div>

<div id="controls">
    <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">Norwich 3D Viewer</div>
    
    <label class="section-title" style="border:none; padding-top:0;">SBI Loader</label>
    <input type="text" id="sbiInput" value="106721928" placeholder="e.g. 106721928">
    <button onclick="runDataLoad()">Load SBI Data</button>

    <div class="layer-row">
        <input type="checkbox" id="chkLayers" checked onchange="toggleLayer('sbi-fill', this.checked); toggleLayer('sbi-line', this.checked)">
        <label for="chkLayers">Land Cover</label>
    </div>

    <div class="layer-row">
        <input type="checkbox" id="chkOFP" checked onchange="toggleLayer('ofp-arrows', this.checked)">
        <label for="chkOFP">Flow Arrows</label>
    </div>

    <div class="layer-row">
        <input type="checkbox" id="chkAwkward" checked onchange="toggleLayer('awkward-fill', this.checked); toggleLayer('awkward-line', this.checked)">
        <label for="chkAwkward">Awkward Corners</label>
    </div>

    <div class="slider-container">
        <label>Terrain Exaggeration: <span id="exagValue">2.0</span>x</label>
        <input id="exaggeration" type="range" min="0" max="10" step="0.1" value="2" />
    </div>

    <div id="loadingIndicator">Ready.</div>
</div>

<div id="legendPanel"></div>

<script>
    // 1. SETUP & CONFIGURATION
    mapboxgl.accessToken = 'pk.eyJ1Ijoid2lzZWZyb2dtYXBib3giLCJhIjoiY21sZ3R2a2JsMDI0MjNmb2cxbnNpZnVxbiJ9.iFfxLC6MrpS-9I9A2w1DtA';
    
    // Define Proj4 for BNG -> WGS84 conversion
    proj4.defs("EPSG:27700", "+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy +towgs84=446.448,-125.157,542.06,0.15,0.247,0.842,-20.489 +units=m +no_defs");

    // Colors mapping
    const landCoverColors = {
        'Arable Land': '#F0E68C', 'Permanent Grassland': '#32CD32', 'Woodland': '#228B22',
        'Natural Woodland': '#006400', 'Pond': '#4682B4', 'Rivers and streams type 3': '#1E90FF',
        'Drain/Ditch/Dyke': '#00BFFF', 'Farm Building': '#8B4513', 'Residential dwelling, House': '#CD5C5C',
        'Farmyards': '#D2B48C', 'Track - Natural Surface': '#DEB887', 'Metalled track': '#808080',
        'Residential Gardens': '#90EE90', 'Non-agricultural land': '#A9A9A9', 'default': '#FFeda0'
    };

    // State
    let currentSbiGeoJSON = null;
    const NORWICH_CENTER = [1.29278, 52.62861];

    // 2. INITIALIZE MAP
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/satellite-v9',
        center: NORWICH_CENTER,
        zoom: 13,
        pitch: 60,
        bearing: 0
    });

    map.addControl(new mapboxgl.NavigationControl());

    // 3. MAP LOAD EVENT
    map.on('load', () => {
        // A. Add 3D Terrain Source
        map.addSource('mapbox-dem', {
            'type': 'raster-dem',
            'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
            'tileSize': 512,
            'maxzoom': 14
        });
        
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 2.0 });

        // B. Add Empty Sources for our Data Layers
        map.addSource('sbi-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addSource('ofp-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addSource('awkward-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

        // C. Define Layers
        
        // 1. SBI Land Cover (Fill)
        map.addLayer({
            'id': 'sbi-fill',
            'type': 'fill',
            'source': 'sbi-data',
            'paint': {
                'fill-color': ['get', 'color'],
                'fill-opacity': 0.6
            }
        });

        // 2. SBI Land Cover (Outline)
        map.addLayer({
            'id': 'sbi-line',
            'type': 'line',
            'source': 'sbi-data',
            'paint': {
                'line-color': '#000',
                'line-width': 1
            }
        });

        // 3. Flow Pathways (Arrows/Lines)
        // Note: Mapbox doesn't support "arrows" easily on lines without complex icon logic.
        // We will use a thick colored line to represent flow.
        map.addLayer({
            'id': 'ofp-arrows',
            'type': 'line',
            'source': 'ofp-data',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': ['case', ['>=', ['get', 'flow'], 50000], '#FF0000', '#0000FF'], // Red for High, Blue for Low
                'line-width': ['case', ['>=', ['get', 'flow'], 50000], 4, 2]
            }
        });

        // 4. Awkward Corners
        map.addLayer({
            'id': 'awkward-fill',
            'type': 'fill',
            'source': 'awkward-data',
            'paint': {
                'fill-color': 'darkorange',
                'fill-opacity': 0.4
            }
        });
        map.addLayer({
            'id': 'awkward-line',
            'type': 'line',
            'source': 'awkward-data',
            'paint': {
                'line-color': 'darkorange',
                'line-width': 2,
                'line-dasharray': [2, 2]
            }
        });

        // Initial Data Load
        runDataLoad();
    });

    // 4. DATA LOGIC

    async function runDataLoad() {
        const sbi = document.getElementById('sbiInput').value.trim();
        const loader = document.getElementById('loadingIndicator');
        const legend = document.getElementById('legendPanel');
        legend.style.display = 'none';

        if(!sbi) return alert("Please enter an SBI number.");

        loader.style.display = 'block';
        loader.innerText = "Fetching RPA Data...";

        try {
            // A. Fetch RPA Data
            const url = `https://environment.data.gov.uk/data-services/RPA/LandCovers/wfs?version=2.0.0&request=GetFeature&typeNames=RPA:LandCovers&cql_filter=SBI=${sbi}&srsname=EPSG:27700&outputFormat=application/json`;
            const response = await fetch(url);
            if(!response.ok) throw new Error("RPA Service Error");
            const data = await response.json();
            
            if (!data.features || data.features.length === 0) {
                loader.innerText = "No data found for this SBI.";
                return;
            }

            // B. Process & Reproject RPA Data
            const processedFeatures = data.features.map(f => {
                // Reproject Geometry
                const reprojected = reprojectGeoJSONFeature(f);
                // Assign Color Property for styling
                const desc = f.properties.DESCRIPTION || 'default';
                reprojected.properties.color = landCoverColors[desc] || landCoverColors['default'];
                reprojected.properties.description = desc;
                return reprojected;
            });

            const sbiGeoJSON = { type: 'FeatureCollection', features: processedFeatures };
            currentSbiGeoJSON = sbiGeoJSON;
            
            // Update Map Source
            map.getSource('sbi-data').setData(sbiGeoJSON);

            // Fit Bounds
            const bbox = turf.bbox(sbiGeoJSON);
            map.fitBounds(bbox, { padding: 50, pitch: 60 });

            // Build Legend
            buildLegend(processedFeatures);

            // C. Load Flow Pathways
            if(document.getElementById('chkOFP').checked) {
                loadClusteredOFP(sbiGeoJSON);
            }

            // D. Load Awkward Corners
            if(document.getElementById('chkAwkward').checked) {
                loadAwkwardCorners();
            }

            loader.innerText = "Data Loaded.";

        } catch (e) {
            console.error(e);
            loader.innerText = "Error: " + e.message;
        }
    }

    async function loadClusteredOFP(sbiGeoJSON) {
        const loader = document.getElementById('loadingIndicator');
        loader.innerText = "Loading Flow Pathways...";

        try {
            // 1. Cluster centroids to minimize API calls (DBSCAN)
            const centroids = turf.featureCollection(sbiGeoJSON.features.map(f => turf.centroid(f)));
            const clustered = turf.clustersDbscan(centroids, 0.5, { units: 'kilometers', minPoints: 1 });
            
            const clusters = {};
            clustered.features.forEach((c, i) => {
                const cid = c.properties.cluster !== undefined ? c.properties.cluster : -1;
                if(!clusters[cid]) clusters[cid] = [];
                clusters[cid].push(sbiGeoJSON.features[i]);
            });

            // 2. Query ArcGIS FeatureServer for each cluster bbox
            const ofpUrl = "https://services1.arcgis.com/JZM7qJpmv7vJ0Hzx/arcgis/rest/services/OverlandFlowPathwaysForPublicALERTEngland_20240318/FeatureServer/0";
            const clusterIds = Object.keys(clusters);
            
            const promises = clusterIds.map(id => {
                const group = turf.featureCollection(clusters[id]);
                const bbox = turf.bbox(group);
                const query = `${ofpUrl}/query?f=geojson&geometry=${bbox.join(',')}&geometryType=esriGeometryEnvelope&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326`;
                return fetch(query).then(r => r.json()).then(d => d.features || []).catch(e => []);
            });

            const results = await Promise.all(promises);
            
            // 3. Deduplicate results
            const allFeatures = [];
            const seen = new Set();
            results.flat().forEach(f => {
                const fid = f.properties.OBJECTID || f.id; 
                if(!seen.has(fid)) {
                    seen.add(fid);
                    allFeatures.push(f);
                }
            });

            // 4. Client-side Intersection Filter
            // Only keep lines that actually touch/cross the SBI polygons
            const filtered = allFeatures.filter(ofp => {
                // Enrich properties for styling
                ofp.properties.flow = ofp.properties.MaxFlowAcc || 0;
                return sbiGeoJSON.features.some(sbi => turf.booleanIntersects(ofp, sbi));
            });

            map.getSource('ofp-data').setData({ type: 'FeatureCollection', features: filtered });
            loader.innerText = `Loaded ${filtered.length} Flow Paths.`;

        } catch(e) {
            console.error("OFP Error", e);
            loader.innerText = "OFP Load Error";
        }
    }

    async function loadAwkwardCorners() {
        const url = 'https://firebasestorage.googleapis.com/v0/b/naturecitynorwich.firebasestorage.app/o/users%2FAbE2j6m8F1aQ7e68C9dVBGPmhLS2%2Fstock_files%2FMucklton%20Farm%20awkward%20corners%20WGS1984.geojson?alt=media&token=0cdd33b5-fd1f-4c12-9388-b076e8b40a32';
        try {
            const res = await fetch(url);
            const data = await res.json();
            map.getSource('awkward-data').setData(data);
        } catch(e) {
            console.error("Awkward Corners Error", e);
        }
    }

    // 5. HELPER FUNCTIONS

    // Coordinate Transform (BNG -> WGS84)
    function reprojectGeoJSONFeature(feature) {
        const f = JSON.parse(JSON.stringify(feature));
        const transform = (coords) => proj4('EPSG:27700', 'EPSG:4326', coords);
        
        const transformGeom = (g) => {
            if(g.type === 'Polygon' || g.type === 'MultiLineString') g.coordinates = g.coordinates.map(r => r.map(transform));
            else if(g.type === 'MultiPolygon') g.coordinates = g.coordinates.map(p => p.map(r => r.map(transform)));
            else if(g.type === 'LineString') g.coordinates = g.coordinates.map(transform);
        };
        
        transformGeom(f.geometry);
        return turf.rewind(f, {reverse: false, mutate: true});
    }

    function buildLegend(features) {
        const legend = document.getElementById('legendPanel');
        const categories = new Set(features.map(f => f.properties.description));
        
        let html = '<strong>Land Cover</strong><br>';
        Array.from(categories).sort().forEach(cat => {
            const color = landCoverColors[cat] || landCoverColors['default'];
            html += `<div class="legend-item"><div class="legend-color" style="background:${color}"></div>${cat}</div>`;
        });
        
        html += '<hr><strong>Flow Pathways</strong><br>';
        html += `<div class="legend-item"><div class="legend-color" style="background:red; height:4px; margin-top:6px;"></div>High Flow (>50k)</div>`;
        html += `<div class="legend-item"><div class="legend-color" style="background:blue; height:2px; margin-top:7px;"></div>Low Flow</div>`;
        
        legend.innerHTML = html;
        legend.style.display = 'block';
    }

    function toggleLayer(layerId, visible) {
        if(map.getLayer(layerId)) {
            map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
        }
    }

    // 6. UI INTERACTION
    
    // Slider Logic
    document.getElementById('exaggeration').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById('exagValue').innerText = val.toFixed(1);
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': val });
    });

    // Popups
    map.on('click', 'sbi-fill', (e) => {
        const props = e.features[0].properties;
        new mapboxgl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>${props.description}</strong><br>Area: ${props.Hectares || '?'} ha`)
            .addTo(map);
    });

</script>
</body>
</html>
